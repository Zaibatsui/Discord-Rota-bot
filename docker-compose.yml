services:
  backend:
    build: ./backend
    container_name: rota-backend
    restart: unless-stopped
    ports:
      - "8003:8001"
    volumes:
      - ./data:/app/data
    healthcheck:
      # python:3.11-slim ships no curl, so probe with the stdlib instead
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  discord-bot:
    build: ./discord-bot
    container_name: rota-discord-bot
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - BACKEND_URL=http://backend:8001/api

  frontend:
    build: ./frontend
    container_name: rota-frontend
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - backend
