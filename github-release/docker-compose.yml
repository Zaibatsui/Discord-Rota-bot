services:
  backend:
    build: ./backend
    container_name: rota-backend
    restart: unless-stopped
    ports:
      - "8003:8001"
    volumes:
      - ./data:/app/data

  discord-bot:
    build: ./discord-bot
    container_name: rota-discord-bot
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - BACKEND_URL=http://backend:8001/api

  frontend:
    build: ./frontend
    container_name: rota-frontend
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - backend
